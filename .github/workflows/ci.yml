# CI: testele backend (inclusiv testele golden pe pacienții-tip) și frontend (lint, tipuri, teste, build).
# O schimbare de scor care strică un test golden sau un snapshot de mesaje pică aici; pentru a bloca merge-ul,
# marchează job-urile ca „required” în Settings → Branches → Branch protection rules (main).
name: CI

on:
  push:
    branches: [main, Update-Version-1.1]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Teste (unitare, API, golden)
        run: python -m pytest -q
      - name: Fixture-urile frontend corespund motorului
        run: |
          python scripts/export_frontend_fixtures.py
          git diff --exit-code -- ../frontend/src/features/recommendations/explanations/__fixtures__/patients.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Teste (mesaje RO/EN, schimbarea limbii fără rețea)
        run: npm test
      - name: Build (include verificarea de tipuri)
        run: npm run build
