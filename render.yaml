# Blueprint pentru un serviciu de preview, separat de producție.
# Secretele (sync: false) se completează în Render la crearea serviciului.
# Notă: folosește același proiect Supabase ca producția, deci datele de test sunt reale.
services:
  - type: web
    name: vitabalance-preview
    runtime: python
    plan: free
    region: frankfurt          # aproape de Supabase (eu-west-1)
    branch: Update-Version-1.1
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY   # cheia service_role, nu anon
        sync: false
      - key: JWT_SECRET                  # separat de producție, ca tokenurile să nu fie interschimbabile
        generateValue: true
      - key: CORS_ORIGINS                # adresa de preview de pe Vercel
        sync: false
