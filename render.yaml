# Serviciu Render separat, pentru testarea branch-ului Update-Version-1.1, fără să atingă serviciul de producție
# (cel care rulează main). Se creează din Render: New > Blueprint > repo-ul VitaBalance > branch Update-Version-1.1.
# Render cere singur valorile marcate `sync: false` (secretele nu sunt în repo).
#
# Atenție: serviciul folosește ACELAȘI proiect Supabase ca producția, deci datele create la test sunt reale.
# După ce branch-ul e unit în main, șterge serviciul "vitabalance-preview" din Render (și acest fișier, dacă nu-l mai vrei).
services:
  - type: web
    name: vitabalance-preview
    runtime: python
    plan: free
    region: frankfurt          # aproape de Supabase (eu-west-1)
    branch: Update-Version-1.1
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY   # cheia service_role, nu anon (vezi README)
        sync: false
      - key: JWT_SECRET                  # generat de Render; separat de producție, deci tokenurile nu se amestecă
        generateValue: true
      - key: CORS_ORIGINS                # adresa de preview de pe Vercel, ex. https://vitabalance-git-update-version-1-1-<cont>.vercel.app
        sync: false
